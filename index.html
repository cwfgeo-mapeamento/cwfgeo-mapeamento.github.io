<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Imóvel · CWF GEO</title>
<!--
  Página do QR do modelo digital da CWF GEO. A planta da Estação CWF imprime um QR com o endereço desta página e,
  depois do "#", o contorno e os dados de leitura do imóvel. O que vem depois do "#" fica no celular: não é enviado
  ao servidor desta página. Esta página não guarda dado de cliente.

  O RT preenche (ver PUBLICAR.md):
    CHAVE_GOOGLE  chave da Maps JavaScript API, travada no endereço desta página e com teto diário de aberturas.
                  Vazia: a página usa só o Esri e o OpenStreetMap, sem custo nenhum.
  Ajustes:
    ZOOM_PONTOS   a partir deste zoom aparecem os pontos (símbolos da legenda da planta)
    ZOOM_CODIGOS  a partir deste zoom aparecem os códigos
    ZOOM_ENQUADRAR  zoom máximo ao abrir (imóvel pequeno não abre colado)
    ESRI_NATIVO   último nível com imagem do Esri no Acre; acima, amplia a última (não fica branco)
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --azul: #0E2841; --azul-claro: #4FD2FF; --texto: #141A1F; --cinza: #5B6670; --fundo: #FFFFFF;
    --borda: #D9D9D9; --erro: #B42318;
  }
  html, body { height: 100%; margin: 0; background: #1b2229; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); }
  #mapa { position: fixed; inset: 0; }
  .marca {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 1000;
    background: var(--azul); color: #fff; font-weight: 700; letter-spacing: .04em; font-size: 12px;
    padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .cartao {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: var(--fundo);
    border-radius: 14px 14px 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.3);
    padding: 6px 16px calc(12px + env(safe-area-inset-bottom)); max-height: 46vh; overflow-y: auto;
  }
  .alca { display: block; width: 100%; border: 0; background: none; padding: 6px 0 4px; cursor: pointer; }
  .alca span { display: block; width: 40px; height: 4px; margin: 0 auto; border-radius: 2px; background: var(--borda); }
  .cartao h1 { font-size: 17px; margin: 2px 0 4px; line-height: 1.25; }
  .numeros { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 4px 0 2px; }
  .numeros b { display: block; font-size: 16px; }
  .numeros small, .rodape, .municipio { color: var(--cinza); }
  .municipio { margin: 0 0 6px; }
  .parcelas { margin: 6px 0 0; padding: 0; list-style: none; }
  .parcelas li { padding: 2px 0; }
  .botoes { display: flex; gap: 8px; margin: 12px 0 8px; }
  .botoes a {
    flex: 1; text-align: center; text-decoration: none; padding: 10px 8px; border-radius: 8px; font-weight: 600;
    border: 1px solid var(--azul); color: var(--azul);
  }
  .botoes a.principal { background: var(--azul); color: #fff; }
  .rodape { font-size: 12px; margin: 4px 0 0; }
  .recolhido .corpo { display: none; }
  .erro h1 { color: var(--erro); }
  .v { box-sizing: border-box; border: 2px solid #111; border-radius: 50%; background: #fff; }
  .v-M::after { content: ""; position: absolute; inset: 2px; border: 1.5px solid #111; border-radius: 50%; }
  .v-P::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
                border-radius: 50%; background: #111; }
  .cod {
    white-space: nowrap; font: 600 11px/1 system-ui, sans-serif; color: #fff;
    text-shadow: 0 0 2px #000, 0 0 3px #000, 0 0 4px #000;
  }
  .letra {
    font: 800 22px/1 system-ui, sans-serif; color: #fff; text-align: center;
    text-shadow: 0 0 3px #000, 0 0 6px #000;
  }
  .aviso-fundo {
    position: fixed; top: max(48px, calc(env(safe-area-inset-top) + 40px)); left: 10px; right: 10px; z-index: 1000;
    background: rgba(14,40,65,.92); color: #fff; font-size: 13px; padding: 8px 10px; border-radius: 6px;
  }
  .leaflet-control-layers-expanded { font-size: 14px; }
  .leaflet-top.leaflet-left { top: calc(max(10px, env(safe-area-inset-top)) + 34px); }   /* abaixo da marca */
</style>
</head>
<body>
<div id="mapa" role="application" aria-label="Mapa do imóvel"></div>
<div class="marca">CWF GEO</div>
<section id="cartao" class="cartao" aria-live="polite">
  <button class="alca" type="button" aria-label="Mostrar ou esconder os dados"><span></span></button>
  <div id="conteudo"><h1>Abrindo o imóvel…</h1></div>
</section>
<noscript><p style="color:#fff;padding:16px">Esta página precisa de JavaScript ligado no navegador.</p></noscript>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js"></script>
<script src="formato.js"></script>
<script>
(function () {
  'use strict';
  var CHAVE_GOOGLE = '';
  var ZOOM_PONTOS = 14, ZOOM_CODIGOS = 15, ZOOM_ENQUADRAR = 18, ESRI_NATIVO = 17, ZOOM_MAX = 20;   // RT, 09/11/2026: códigos com menos zoom
  var AZUL_CLARO = '#4FD2FF', CONTORNO_FUNDO = '#06263D';

  var cartao = document.getElementById('cartao');
  var conteudo = document.getElementById('conteudo');
  cartao.querySelector('.alca').addEventListener('click', function () { cartao.classList.toggle('recolhido'); });
  window.addEventListener('hashchange', function () { location.reload(); });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function mostrarErro(titulo, texto) {
    cartao.classList.add('erro');
    conteudo.innerHTML = '<h1>' + esc(titulo) + '</h1><p>' + esc(texto) + '</p>' +
      '<p class="rodape">Contorno para visualização. Coordenadas oficiais na planta e no memorial.</p>';
  }

  if (!window.L || !window.CwfFormato) {
    mostrarErro('Sem conexão', 'Não consegui carregar o mapa. Confira a internet do celular e abra de novo.');
    return;
  }

  var imovel;
  try {
    imovel = window.CwfFormato.ler(location.hash);
  } catch (e) {
    var textos = {
      vazio: ['Nenhum imóvel neste endereço', 'Leia o QR da planta com a câmera do celular.'],
      formato: ['Página desatualizada', 'Este QR é de uma versão mais nova. Recarregue a página; se continuar, ' +
                'fale com a CWF GEO.'],
      quebrado: ['Link incompleto', 'O endereço chegou cortado ou mexido. Leia o QR de novo, de perto e com boa luz.']
    };
    var t = textos[e.tipo] || ['Não consegui abrir o imóvel', String(e.message || e)];
    mostrarErro(t[0], t[1]);
    return;
  }
  if (imovel.titulo) document.title = imovel.titulo + ' · CWF GEO';

  // ---------------------------------------------------------------- mapa e fundos
  var mapa = L.map('mapa', { zoomControl: true, maxZoom: ZOOM_MAX, attributionControl: true });
  mapa.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: ESRI_NATIVO, maxZoom: ZOOM_MAX,
    attribution: 'Imagem &copy; Esri, Maxar, Earthstar Geographics e comunidade GIS'
  });
  var ruas = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxNativeZoom: 19, maxZoom: ZOOM_MAX,
    attribution: '&copy; colaboradores do <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  });
  var fundos = { 'Satélite Esri': esri, 'Ruas (OpenStreetMap)': ruas };
  var controle = L.control.layers(fundos, null, { position: 'topright' }).addTo(mapa);
  var google = null, googleCaiu = false;

  function avisoFundo(texto) {
    var d = document.createElement('div');
    d.className = 'aviso-fundo';
    d.textContent = texto;
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 6000);
  }

  function usarEsri(motivo) {
    if (googleCaiu) return;
    googleCaiu = true;
    if (google) {
      controle.removeLayer(google);
      if (mapa.hasLayer(google)) mapa.removeLayer(google);
    }
    if (!mapa.hasLayer(ruas)) esri.addTo(mapa);
    if (motivo) avisoFundo(motivo);
  }

  function vigiarErroGoogle() {          // chave recusada ou teto do dia: o Google mostra a mensagem de erro dele
    var n = 0, t = setInterval(function () {
      if (document.querySelector('.gm-err-container, .gm-err-message')) {
        clearInterval(t);
        usarEsri('A imagem do Google não está disponível agora; mostrando a do Esri.');
      } else if (++n > 20) {
        clearInterval(t);
      }
    }, 1000);
  }

  if (CHAVE_GOOGLE) {
    window.gm_authFailure = function () { usarEsri('A imagem do Google não está disponível agora; mostrando a do Esri.'); };
    window.cwfGoogleCarregou = function () {
      if (googleCaiu) return;
      try {
        google = L.gridLayer.googleMutant({ type: 'satellite', maxZoom: ZOOM_MAX });
        controle.addBaseLayer(google, 'Satélite Google');
        if (mapa.hasLayer(esri)) mapa.removeLayer(esri);
        google.addTo(mapa);
        vigiarErroGoogle();
      } catch (e) {
        usarEsri('A imagem do Google não carregou; mostrando a do Esri.');
      }
    };
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(CHAVE_GOOGLE) +
            '&callback=cwfGoogleCarregou';
    s.onerror = function () { usarEsri('A imagem do Google não carregou; mostrando a do Esri.'); };
    document.head.appendChild(s);
    setTimeout(function () { if (!google) usarEsri(''); }, 8000);
    esri.addTo(mapa);                    // enquanto o Google não chega
  } else {
    esri.addTo(mapa);
  }

  // ---------------------------------------------------------------- imóvel
  var todos = [], pontos = L.layerGroup(), codigos = L.layerGroup(), maior = null, maiorArea = -1;

  function areaAnel(ll) {
    var a = 0;
    for (var i = 0, j = ll.length - 1; i < ll.length; j = i++) a += (ll[j][1] + ll[i][1]) * (ll[j][0] - ll[i][0]);
    return Math.abs(a / 2);
  }

  function centro(ll) {                  // centroide do polígono (cai na média se for degenerado)
    var a = 0, x = 0, y = 0;
    for (var i = 0, j = ll.length - 1; i < ll.length; j = i++) {
      var f = ll[j][1] * ll[i][0] - ll[i][1] * ll[j][0];
      a += f; x += (ll[j][1] + ll[i][1]) * f; y += (ll[j][0] + ll[i][0]) * f;
    }
    if (Math.abs(a) < 1e-14) {
      var s0 = 0, s1 = 0;
      ll.forEach(function (p) { s0 += p[0]; s1 += p[1]; });
      return [s0 / ll.length, s1 / ll.length];
    }
    return [y / (3 * a), x / (3 * a)];
  }

  imovel.parcelas.forEach(function (p) {
    var ll = p.pontos.map(function (q) { return [q.lat, q.lon]; });
    todos = todos.concat(ll);
    L.polygon(ll, { color: CONTORNO_FUNDO, weight: 5, opacity: 0.55, fill: false, interactive: false }).addTo(mapa);
    L.polygon(ll, { color: AZUL_CLARO, weight: 2.5, fillColor: AZUL_CLARO, fillOpacity: 0.12, interactive: false })
      .addTo(mapa);
    var ar = areaAnel(ll);
    if (ar > maiorArea) { maiorArea = ar; maior = ll; }
    if (p.nome && imovel.parcelas.length > 1) {
      L.marker(centro(ll), { interactive: false, icon: L.divIcon({ className: 'letra', html: esc(p.nome),
        iconSize: [40, 24], iconAnchor: [20, 12] }) }).addTo(mapa);
    }
    p.pontos.forEach(function (q) {
      if (!q.tipo) return;               // contorno simplificado: sem pontos
      L.marker([q.lat, q.lon], { interactive: false, keyboard: false, icon: L.divIcon({
        className: 'v v-' + q.tipo, iconSize: q.tipo === 'M' ? [14, 14] : [12, 12] }) }).addTo(pontos);
      if (q.codigo) {
        L.marker([q.lat, q.lon], { interactive: false, keyboard: false, icon: L.divIcon({
          className: 'cod', html: esc(q.codigo), iconSize: null, iconAnchor: [-9, 6] }) }).addTo(codigos);
      }
    });
  });

  function camadasDoZoom() {
    var z = mapa.getZoom();
    if (z >= ZOOM_PONTOS) pontos.addTo(mapa); else pontos.remove();
    if (z >= ZOOM_CODIGOS) codigos.addTo(mapa); else codigos.remove();
  }
  mapa.on('zoomend', camadasDoZoom);

  // ---------------------------------------------------------------- cartão
  var c = centro(maior || todos);
  var ponto = c[0].toFixed(6) + ',' + c[1].toFixed(6);
  var html = '<div class="corpo-cab"><h1>' + esc(imovel.titulo || 'Imóvel') + '</h1>' +
    (imovel.municipio ? '<p class="municipio">' + esc(imovel.municipio) + '</p>' : '') + '</div><div class="corpo">' +
    '<div class="numeros"><div><small>Área</small><b>' + esc(imovel.area) + '</b></div>' +
    '<div><small>Perímetro</small><b>' + esc(imovel.perimetro) + '</b></div></div>';
  if (imovel.parcelas.length > 1) {
    html += '<ul class="parcelas">' + imovel.parcelas.map(function (p) {
      return '<li>Parcela ' + esc(p.nome) + ': ' + esc(p.area) + '</li>';
    }).join('') + '</ul>';
  }
  html += '<div class="botoes">' +
    '<a class="principal" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&amp;destination=' +
    ponto + '">Como chegar</a>' +
    '<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=' + ponto +
    '">Google Maps</a></div>';
  // o corte do QR (sem códigos, contorno simplificado) não vira nota no cartão: quem abre não precisa saber (RT,
  // 07/11/2026: "pode retirar"); a conferência da Estação continua avisando o RT
  html += '<p class="rodape">Contorno para visualização. Coordenadas oficiais na planta e no memorial.</p></div>';
  conteudo.innerHTML = html;

  function enquadrar() {
    var alto = cartao.classList.contains('recolhido') ? 60 : Math.min(cartao.offsetHeight, window.innerHeight * 0.46);
    mapa.fitBounds(L.latLngBounds(todos), { paddingTopLeft: [24, 56], paddingBottomRight: [24, alto + 16],
                                            maxZoom: ZOOM_ENQUADRAR });
    camadasDoZoom();
  }
  enquadrar();
})();
</script>
</body>
</html>
